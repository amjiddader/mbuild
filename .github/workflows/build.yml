name: testBuild
on:
  workflow_dispatch:

jobs:
  gui-session:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. Enable Screen Sharing and VNC Server on macOS Latest
    - name: Enable Screen Sharing
      run: |
        sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
        sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsEnabled -bool true
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes \
          -clientopts -setvncpw -vncpw "macpassword123" \
          -restart -agent -privs -all

    # 2. Set macOS User Password
    - name: Set User Password
      run: |
        sudo dscl . -passwd /Users/runner "macpassword123"

    # 3. Start Ngrok Tunnel and Print Connection Details
    - name: Start Tunnel
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        brew install ngrok
        ngrok config add-authtoken $NGROK_TOKEN
        ngrok tcp 5900 --log=stdout > ngrok.log &
        sleep 8
        echo "=========================================="
        echo "CONNECT TO THIS ADDRESS IN YOUR VNC VIEWER:"
        curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
        echo "Username: runner"
        echo "Password: macpassword123"
        echo "=========================================="
        sleep 20000
